<!-- Overlay Background -->
<div
  class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center"
>
  <!-- Popup Container -->
  <div class="bg-white w-full max-w-md rounded-lg shadow-lg p-4">
    <!-- Header Section -->
    <div class="flex justify-between items-center border-b pb-2">
      <h2 class="text-lg font-bold text-gray-700">Location</h2>
      <button class="text-red-800 text-lg font-bold" (click)="closePopup()">
        ✖
      </button>
    </div>
    <h2 class="text-lg font-bold text-center mb-3 text-red-800">Select Location</h2>

    <!-- Content -->
    <div class="py-4 bg-gray-50">
      <div class="relative">
        <button
          (click)="toggleDropdown()"
          class="w-full text-gray-600 px-4 py-2 rounded flex justify-between items-center transition"
        >
          {{ selectedLocation || "Choose a Location" }}
          <span>&#9660;</span>
        </button>

        <div
          *ngIf="isDropdownOpen"
          class="absolute left-0 w-full bg-gray-50 shadow-md rounded mt-2 z-10 border border-gray-300"
          style="max-height: 250px; overflow-y: auto"
        >
          <ul class="text-sm divide-y divide-gray-100">
            <li
              *ngFor="let location of locations"
              (click)="selectLocation(location)"
              class="p-3 hover:bg-teal-100 cursor-pointer transition rounded"
            >
              {{ location }}
            </li>
          </ul>
        </div>
      </div>
    </div>

    <!-- Action Buttons -->
    <div class="flex justify-end space-x-4 pt-4">
      <button class="bg-gray-400 text-white px-4 py-2 rounded-lg" (click)="closePopup()">
        Cancel
      </button>
      <button
        class="bg-red-800 text-white px-4 py-2 rounded-lg"
        (click)="confirmLocation()"
      >
        Confirm
      </button>
    </div>
  </div>
</div>
