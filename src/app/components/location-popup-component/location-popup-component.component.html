<div class="p-6 bg-white rounded-lg shadow-lg max-w-sm mx-auto">
  <h2 class="text-lg font-bold text-teal-700 text-center mb-3">
    Select Your Location
  </h2>

  <div class="relative">
    <button
      (click)="toggleDropdown()"
      class="w-full bg-teal-600 text-white px-4 py-2 rounded flex justify-between items-center hover:bg-teal-700 transition"
    >
      {{ selectedLocation || "Choose a Location" }}
      <span>&#9660;</span>
      <!-- Dropdown Arrow -->
    </button>

    <div
      *ngIf="isDropdownOpen"
      class="absolute left-0 w-full bg-white shadow-lg rounded mt-2 z-10 border border-gray-300"
      style="max-height: 250px; overflow-y: auto; padding-bottom: 70px"
    >
      <ul class="text-sm divide-y divide-gray-200">
        <li
          *ngFor="let location of locations"
          (click)="selectLocation(location)"
          class="p-2 hover:bg-teal-50 cursor-pointer transition"
        >
          {{ location }}
        </li>
      </ul>
    </div>
  </div>
     <!-- ✅ Ensure Button Appears After Selection -->
     <div  class="p-3 text-center">
      <button
        (click)="confirmLocation()"
        class="bg-teal-600 text-white px-4 py-2 rounded hover:bg-teal-700 transition">
        OK
      </button>
    </div>
</div>
