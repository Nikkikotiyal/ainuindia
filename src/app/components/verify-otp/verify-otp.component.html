<div class="min-h-screen flex items-center justify-center bg-gray-100">
  <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-md">
    <h2 class="text-2xl font-semibold text-center text-red-800 mb-6">Verify OTP</h2>

    <p class="text-sm text-gray-600 text-center mb-6">
      Enter the 4-digit code sent to your registered email or phone.
    </p>

    <!-- OTP Inputs -->
    <div class="flex justify-center gap-3 mb-6">
      <input type="text" maxlength="1" class="otp-input" />
      <input type="text" maxlength="1" class="otp-input" />
      <input type="text" maxlength="1" class="otp-input" />
      <input type="text" maxlength="1" class="otp-input" />
    </div>

    <!-- Verify Button -->
    <button (click)="verifyOtp()"
      class="w-full bg-red-800 text-white py-2 rounded-lg hover:bg-red-800 transition"
    >
      Verify
    </button>

    <!-- Resend Link -->
    <div class="text-center mt-4 text-sm text-gray-500">
      Didn’t receive the code?
      <button class="text-red-800 font-medium hover:underline ml-1">
        Resend OTP
      </button>
    </div>
  </div>
</div>
