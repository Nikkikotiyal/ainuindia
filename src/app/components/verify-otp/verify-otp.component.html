<div class="min-h-screen flex items-center justify-center bg-gray-100">
  <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-md">
    <h2 class="text-2xl font-semibold text-center text-red-800 mb-6">
      Verify OTP
    </h2>

    <p class="text-sm text-gray-600 text-center mb-6">
      Enter the 4-digit code sent to your registered email or phone.
    </p>

    <!-- OTP Inputs -->
    <div class="flex justify-center gap-3 mb-6">
      <input
        type="text"
        maxlength="1"
        class="otp-input"
        (input)="moveToNext($event, 0)"
        #otp0
      />
      <input
        type="text"
        maxlength="1"
        class="otp-input"
        (input)="moveToNext($event, 1)"
        #otp1
      />
      <input
        type="text"
        maxlength="1"
        class="otp-input"
        (input)="moveToNext($event, 2)"
        #otp2
      />
      <input
        type="text"
        maxlength="1"
        class="otp-input"
        (input)="moveToNext($event, 3)"
        #otp3
      />
    </div>

    <!-- Verify Button -->
    <button
      (click)="verifyOtp()"
      class="w-full bg-red-800 text-white py-2 rounded-lg hover:bg-red-900 transition"
    >
      Verify
    </button>

    <!-- Error Message -->
    <p *ngIf="invalidOtpError" class="text-red-800 text-sm text-center mt-2">
      {{ invalidOtpError }}
    </p>

    <!-- Resend OTP -->
    <div class="text-center mt-4 text-sm text-gray-500">
      Didn’t receive the code?
      <button
        class="text-red-800 font-medium hover:underline ml-1"
        (click)="resendOtp()"
      >
        Resend OTP
      </button>
    </div>

    <!-- Back to Login -->
    <div class="text-center mt-4">
      <button
        class="text-sm text-red-800 font-medium hover:underline"
        (click)="navigateToLogin()"
      >
        ← Back to Login
      </button>
    </div>
  </div>
</div>
