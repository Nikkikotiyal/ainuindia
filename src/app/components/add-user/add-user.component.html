<div class="dialog-container p-4 bg-white rounded-lg shadow-md">
  <h2 class="text-lg font-bold mb-3">Add User</h2>
  <button
    type="submit"
    (click)="addUserSuccesfully()"
    class="bg-teal-700 text-white w-full py-2 rounded-lg hover:bg-teal-800 transition"
  >
    Add
  </button>
  <form>
    <label class="block mb-1">Name:</label>
    <input
      type="text"
      class="w-full p-2 border rounded mb-3"
      placeholder="Enter name"
      [(ngModel)]="formData.UserName"
      name="UserName"
    />

    <label class="block mb-1">Email:</label>
    <input
      type="email"
      class="w-full p-2 border rounded mb-3"
      placeholder="Enter email"
      [(ngModel)]="formData.Email"
      name="Email"
    />

    <label class="block mb-1">MobileNo:</label>
    <input
      type="number"
      class="w-full p-2 border rounded mb-3"
      placeholder="Enter mobile no"
      [(ngModel)]="formData.MobileNo"
      name="MobileNo"
    />

    <label class="block mb-1">Designation:</label>
    <input
      type="text"
      class="w-full p-2 border rounded mb-3"
      placeholder="Enter designation"
      [(ngModel)]="formData.Designation"
      name="Designation"
    />

    <label class="block mb-1">Status:</label>
    <select
      class="w-full p-2 border rounded mb-3"
      [(ngModel)]="formData.Status"
      name="Status"
    >
      <option value="A">Active</option>
      <option value="I">Inactive</option>
    </select>
    <div class="dropdown-container">
      <div class="selected-items">
        <span *ngFor="let loc of selectedLocations" class="selected-tag">
          {{ loc }}
          <button class="remove-btn" (click)="removeLocation(loc)">×</button>
        </span>
      </div>

      <input
        type="text"
        placeholder="Select locations..."
        [value]="selectedLocations.join(', ')"
        readonly
        class="search-box"
        (focus)="dropdownOpen = true"
      />
      <div *ngIf="dropdownOpen" class="dropdown">
        <div class="dropdown-list">
          <label *ngFor="let location of filteredLocations">
            <input
              type="checkbox"
              [checked]="selectedLocations.includes(location)"
              (change)="toggleLocation(location)"
            />
            {{ location }}
          </label>
        </div>
      </div>
    </div>
  </form>
</div>
