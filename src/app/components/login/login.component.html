<div class="flex flex-col md:flex-row h-screen">
  <!-- Left Panel (Form Area) -->
  <div class="w-full md:w-1/2 bg-red-50 flex justify-center items-center p-4">
    <form
      [formGroup]="loginForm"
      class="bg-gray-100 p-6 md:p-8 rounded-2xl shadow-md w-full max-w-md space-y-4"
    >
      <!-- Back Arrow & Social Login -->
      <div class="pb-4 border-b border-gray-200 text-center">
        <h2 class="font-semibold text-gray-600 text-md">Sign in with</h2>
        <div class="flex justify-center my-4">
          <img
            src="https://ainuindia.org/img/ainu-rebranding-new-logo.svg"
            alt="AINU Logo"
            class="w-24 h-auto"
          />
        </div>
        <p class="text-sm text-gray-400 font-medium">
          Or sign in with credentials
        </p>
      </div>

      <!-- Credential Inputs -->
      <h2 class="text-center text-xl font-semibold text-gray-800 mt-4">
        SIGN IN
      </h2>

      <input
        type="email"
        class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-teal-500"
        formControlName="emailOrUsername"
        placeholder="Your Email"
        [ngClass]="{ 'is-invalid': submitted && f['emailOrUsername'].errors }"
        autocomplete="off"
      />
      <div
        *ngIf="f['emailOrUsername']?.touched && f['emailOrUsername'].errors"
        class="text-red-600 text-sm"
      >
        <div *ngIf="f['emailOrUsername'].errors['required']">
          Email is required
        </div>
      </div>

      <input
        type="password"
        class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-teal-500"
        formControlName="password"
        placeholder="Your Password"
        [ngClass]="{ 'is-invalid': submitted && f['password'].errors }"
      />
      <div
        *ngIf="f['password']?.touched && f['password'].errors"
        class="text-red-600 text-sm"
      >
        <div *ngIf="f['password'].errors['required']">Password is required</div>
      </div>

      <button
        type="submit"
        (click)="onLogin()"
        class="w-full bg-red-900 text-white py-2 rounded-md hover:bg-red-800 transition-colors"
      >
        Login
      </button>

      <div *ngIf="loginError" class="text-red-600 text-sm text-center mt-2">
        {{ loginError }}
      </div>

      <p
        class="text-right text-sm text-gray-500 mt-2 cursor-pointer hover:underline"
        routerLink="/forgotpassword"
      >
        Forgot Password?
      </p>
    </form>
  </div>

  <!-- Right Panel (Background Image) -->
  <div class="hidden md:block md:w-1/2 relative">
    <div class="absolute inset-0 bg-cover bg-center sliding-bg"></div>
    <div class="absolute bottom-0 w-full">
      <svg viewBox="0 0 1440 320" class="w-full h-auto">
        <path
          fill="#952222"
          fill-opacity="1"
          d="M0,192L48,186.7C96,181,192,171,288,186.7C384,203,480,245,576,245.3C672,245,768,203,864,165.3C960,128,1056,96,1152,80C1248,64,1344,64,1392,64L1440,64L1440,320L0,320Z"
        ></path>
      </svg>
    </div>
  </div>

  <!-- <div class="hidden md:block md:w-1/2 bg-cover bg-center sliding-bg"></div> -->
</div>
