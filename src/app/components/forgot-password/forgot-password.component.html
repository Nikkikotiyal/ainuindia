<div class="min-h-screen bg-red-50 flex items-center justify-center px-4">
  <div class="w-full max-w-md">
    <div class="bg-gray-100 rounded-lg overflow-hidden shadow-lg">
      <!-- Header -->
      <div class="bg-gray-200 px-8 py-6 text-center">
        <h2 class="text-red-800 font-semibold text-md">
          Forgot Your Password?
        </h2>
      </div>

      <!-- Form -->
      <div class="px-8 py-6">
        <form [formGroup]="forgotPasswordForm">
          <div class="mb-4">
            <label
              for="email"
              class="block text-sm font-semibold text-gray-600 mb-1 uppercase"
              >Email</label
            >
            <input
              id="email"
              type="email"
              formControlName="email"
              placeholder="Your Email"
              class="w-full px-4 py-3 rounded shadow text-sm text-gray-700 placeholder-gray-400 bg-white border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500"
            />
          </div>

          <button
            (click)="submit()"
            type="submit"
            class="w-full bg-red-800 text-white py-2 rounded-md hover:bg-red-800 transition-colors"
          >
            Reset Password
          </button>
        </form>
      </div>
    </div>

    <!-- Links -->
    <div class="flex justify-between text-sm text-gray-200 mt-6 px-1">
      <!-- <a routerLink="" class="hover:underline">Already have an account? Login!</a>
      <a routerLink="/register" class="hover:underline">Create new account</a> -->
    </div>
  </div>
</div>
